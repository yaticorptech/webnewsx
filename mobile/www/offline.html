<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WebNEWS — offline</title>
    <!-- Shown when the website can't be reached (capacitor.config.ts → server.errorPath). -->
    <style>
      :root { --ink: #16181d; --muted: #5b6070; --brand: #e0312b; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #fff; color: var(--ink); }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      .mark { font-size: 28px; font-weight: 900; letter-spacing: -0.02em; }
      .mark span { color: var(--brand); }
      h1 { margin: 8px 0 0; font-size: 20px; }
      p { margin: 0; max-width: 300px; color: var(--muted); line-height: 1.45; }
      button {
        margin-top: 12px; min-height: 44px; padding: 0 28px; border: 0; border-radius: 999px;
        background: var(--brand); color: #fff; font: inherit; font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="mark">Web<span>NEWS</span></div>
    <h1>You're offline</h1>
    <p>We couldn't reach WebNEWS. Check your connection and try again.</p>
    <button type="button" onclick="location.replace(window.WEBNEWS_URL || location.origin + '/')">Try again</button>
    <!-- Written by capacitor.config.ts (on Android this page is served on the site's own address instead). -->
    <script src="app-url.js"></script>
  </body>
</html>
